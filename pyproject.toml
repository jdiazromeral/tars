[project]
name = "tars"
version = "0.1.0"
description = "TARS Answers from Raw Sources — local-first second brain: immutable raw archive + SQLite/FTS5 index + promoted notes"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pypdf>=5.0",
    "pyyaml>=6.0",
]

[project.scripts]
tars = "tars.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tars"]
